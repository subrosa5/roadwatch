name: Checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python3 -m py_compile collector/collector.py collector/publisher.py collector/outbox.py collector/collision.py collector/botkeep/main.py tools/build-botkeep.py tools/generate_media.py
      - run: python3 tools/test_publisher.py
      - name: Prepare isolated collector test environment
        run: |
          python3 -m venv /tmp/roadwatch-ci-venv
          /tmp/roadwatch-ci-venv/bin/pip install -r collector/botkeep/requirements.txt
      - name: Collector mechanics and retry queue
        run: |
          /tmp/roadwatch-ci-venv/bin/python tools/test_collector.py
          /tmp/roadwatch-ci-venv/bin/python tools/test_runtime.py
          /tmp/roadwatch-ci-venv/bin/python tools/test_vehicles.py
          /tmp/roadwatch-ci-venv/bin/python tools/test_preflight.py
      - name: Synthetic collector to Worker video round trip
        env:
          CV_PYTHON: /tmp/roadwatch-ci-venv/bin/python
        run: node tools/collector-e2e.mjs
